# Default: read state and execute the policy; never create motor publishers.
output_enabled: false
simulation_mode: false
allow_hardware_output: false
start_mode: rl
require_deadman: false
# Diagnostic default. Verify the actual sensor rigid body and conventions;
# the vendor topic name alone does not identify the physical IMU frame.
imu_topic: /aima/hal/imu/torso/state
imu_frame: unverified
publish_dt: 0.002
state_timeout: 0.10
joy_timeout: 0.30
max_tilt_degrees: 35.0
max_default_pose_error: 0.45
transition_duration: 3.0
gain_scale: 1.0
damping_gain: 5.0
safety:
  max_command_x: 0.35
  max_command_y: 0.20
  max_command_yaw: 0.30
  action_clip: 100.0
  action_scale_factor: 1.0
  joint_limit_margin: 0.0
  max_position_deviation: 10.0
  max_target_velocity: 1000.0
joystick:
  deadman_button: 4
  disarm_button: 0
  damping_button: 1
  default_button: 2
  rl_button: 3
  forward_axis: 1
  lateral_axis: 0
  yaw_axis: 3
  forward_axis_sign: -1.0
  lateral_axis_sign: -1.0
  yaw_axis_sign: -1.0
