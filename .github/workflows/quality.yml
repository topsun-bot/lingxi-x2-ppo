name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify sources, links, checksums and archived results
        run: python tools/check_release.py
      - name: Build and run independent deployment core tests
        run: ./deployment/scripts/test_core.sh
      - name: Install CPU ONNX check dependencies
        run: python -m pip install numpy==2.1.0 onnx==1.22.0
      - name: Validate ONNX contract and finite outputs
        run: python tools/check_release.py --onnx
